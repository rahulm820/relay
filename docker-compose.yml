# Relay topology (architecture §14). Start: cp .env.example .env && docker compose up -d --build
# Then migrate+seed on the host (see README): npm run db:migrate -w @relay/db && npm run db:seed -w @relay/db
# Switch runs from its own checkout (see README "Switch"); point SWITCH_GATEWAY_URL at it.
name: relay

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relay} -d ${POSTGRES_DB:-relay}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: api
    env_file: .env
    environment:
      # relay_api is a non-owner login, so row-level security applies to the API.
      DATABASE_URL: postgres://relay_api:${RELAY_API_DB_PASSWORD:-change-me-api}@postgres:5432/${POSTGRES_DB:-relay}
      REDIS_URL: redis://redis:6379
      API_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: worker
    env_file: .env
    environment:
      # relay_worker is a non-owner login, so row-level security applies to the worker.
      DATABASE_URL: postgres://relay_worker:${RELAY_WORKER_DB_PASSWORD:-change-me-worker}@postgres:5432/${POSTGRES_DB:-relay}
      REDIS_URL: redis://redis:6379
      WORKER_PORT: 8081
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      # Server-side only: Next proxies /api/* to the API, so the browser never sees this.
      RELAY_API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Webhook tunnel (Telegram/GitHub need public HTTPS). Profile-only: start with
  #   docker compose --profile tunnel up -d
  # after setting TELEGRAM_WEBHOOK_PUBLIC_URL to your tunnel domain in .env.
  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   profiles: ["tunnel"]
  #   command: tunnel --url http://api:8080
  #   depends_on: [api]

  # Switch (team chat + ticket rooms) runs from the Switch checkout, not here:
  #   cd /home/rahul/switch && docker compose up -d   # gateway :8000, Mattermost :8065
  #   npm run switch:bootstrap -w @relay/switch       # relay-triager + relay-notifier agents
  # See README "How Switch is used". switch-core service intentionally not defined here.

volumes:
  pgdata:
